[package]
name = "pm-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Seed handling, identity derivation, and a vodozemac session wrapper for Yougle."

[dependencies]
pm-proto = { path = "../pm-proto" }
thiserror = { workspace = true }
hkdf = "0.12"
sha2 = "0.10"
bip39 = { version = "2", features = ["std", "rand"] }
ed25519-dalek = "2"
vodozemac = "0.10"
serde_json = "1"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]
hex = "0.4"
