[package]
name = "pm-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLCipher-encrypted local storage: schema, migrations, and Lamport-clock ordering."

[dependencies]
thiserror = { workspace = true }
# bundled-sqlcipher-vendored-openssl (not plain bundled-sqlcipher): when
# cross-compiling (e.g. to Android), there's no pre-built OpenSSL for the
# target lying around. This variant builds OpenSSL from source for whatever
# target is being compiled, at the cost of a slower build.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
hex = "0.4"
serde = { workspace = true }

[dev-dependencies]
pm-proto = { path = "../pm-proto" }
pm-crypto = { path = "../pm-crypto" }
tempfile = "3"
ed25519-dalek = "2"
