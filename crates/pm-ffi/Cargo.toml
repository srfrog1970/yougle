[package]
name = "pm-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "uniffi interface exposing pm-core's Client to the React Native app via uniffi-bindgen-react-native."

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
pm-core = { path = "../pm-core" }
pm-crypto = { path = "../pm-crypto" }
pm-store = { path = "../pm-store" }
uniffi = { version = "0.29", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
bincode = "1"
thiserror = { workspace = true }
iroh = "1"

[dev-dependencies]
tempfile = "3"
