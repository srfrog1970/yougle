[package]
name = "pm-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Server mailbox binary: single-tenant, self-hosted, WRITE/FETCH/ACK over iroh."

[[bin]]
name = "pm-node"
path = "src/main.rs"

[dependencies]
pm-proto = { path = "../pm-proto" }
pm-transport = { path = "../pm-transport" }
thiserror = { workspace = true }
iroh = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
bincode = "1"
sha2 = "0.10"
hex = "0.4"
hkdf = "0.12"
tracing-subscriber = "0.3"
# bundled-sqlcipher-vendored-openssl (not plain bundled-sqlcipher): matches
# pm-store's own choice — see that crate's Cargo.toml for why (irrelevant
# to pm-node specifically, since it's never cross-compiled, but Cargo
# unifies feature flags workspace-wide for a shared dependency regardless).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
pm-crypto = { path = "../pm-crypto" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ed25519-dalek = "2"
tempfile = "3"
