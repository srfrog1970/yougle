[package]
name = "pm-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Server mailbox binary: single-tenant, self-hosted, WRITE/FETCH/ACK over iroh."

[[bin]]
name = "pm-node"
path = "src/main.rs"

[dependencies]
pm-proto = { path = "../pm-proto" }
pm-transport = { path = "../pm-transport" }
thiserror = { workspace = true }
iroh = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
bincode = "1"
sha2 = "0.10"
hex = "0.4"
tracing-subscriber = "0.3"

[dev-dependencies]
pm-crypto = { path = "../pm-crypto" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ed25519-dalek = "2"
